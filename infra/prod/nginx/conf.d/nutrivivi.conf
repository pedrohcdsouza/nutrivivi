# ── nutrivivi.com.br ─────────────────────────────────────────────────────────
server {
    listen 80;
    server_name nutrivivi.com.br www.nutrivivi.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name nutrivivi.com.br www.nutrivivi.com.br;

    ssl_certificate     /etc/letsencrypt/live/nutrivivi.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nutrivivi.com.br/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 10M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        set $frontend frontend:3000;
        proxy_pass http://$frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── api.nutrivivi.com.br ──────────────────────────────────────────────────────
