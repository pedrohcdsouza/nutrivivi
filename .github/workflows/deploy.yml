name: Deploy to Production

on:
  push:
    tags:
      - 'v*-main'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Preserve .env on VPS before sync
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            [ -f ~/nutrivivi/.env ] && cp ~/nutrivivi/.env /tmp/.nutrivivi_env_backup || true

      - name: Copy project files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "."
          target: "~/nutrivivi"
          rm: true
          exclude: ".git,.env"

      - name: Restore .env and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            [ -f /tmp/.nutrivivi_env_backup ] && mv /tmp/.nutrivivi_env_backup ~/nutrivivi/.env
            cd ~/nutrivivi
            docker compose --project-directory ~/nutrivivi -f infra/prod/docker-compose.yml up -d --build
