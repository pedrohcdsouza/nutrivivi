services:
  db:
    image: postgres:15-alpine
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_USER:-nutrivivi}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-nutrivivi}
      - POSTGRES_DB=${DB_NAME:-nutrivivi}

  backend:
    image: ghcr.io/pedrohcdsouza/nutrivivi-backend:${TAG:-latest}
    restart: always
    environment:
      - DATABASE_URL=postgres://${DB_USER:-nutrivivi}:${DB_PASSWORD:-nutrivivi}@db:5432/${DB_NAME:-nutrivivi}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - NUTRITIONIST_EMAIL=${NUTRITIONIST_EMAIL}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
    depends_on:
      - db
    command: >
      sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  frontend:
    image: ghcr.io/pedrohcdsouza/nutrivivi-frontend:${TAG:-latest}
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/auth:/etc/nginx/auth
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend
      - frontend

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  postgres_data:
