[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501"]
"backend/config/settings/dev.py" = ["F403", "F405"]
"backend/config/settings/prod.py" = ["F403", "F405"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
