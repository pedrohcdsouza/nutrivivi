name: Deploy to Production

on:
  push:
    tags:
      - 'v*-main'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy project files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "."
          target: "~/nutrivivi"
          rm: true

      - name: Execute Docker Compose on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd ~/nutrivivi
            # Ensure .env exists. You need to create this manually on the server beforehand or pass it somehow.
            # We assume it's created or we echo minimums. For security, .env should be managed on the server.
            docker compose -f infra/prod/docker-compose.yml up -d --build
